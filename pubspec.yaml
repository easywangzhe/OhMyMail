name: oh_my_mail
description: Local-first cross-platform mailbox manager for personal and small-team use.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_links: ^6.3.2
  collection: ^1.18.0
  enough_mail: ^2.1.7
  flutter_appauth: ^8.0.3
  flutter_local_notifications: ^21.0.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  launch_at_startup: ^0.3.1
  package_info_plus: ^8.1.2
  path: ^1.9.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  tray_manager: ^0.5.2
  url_launcher: ^6.3.1
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
